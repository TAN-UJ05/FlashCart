server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

spring:
  application:
    name: flashcart-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flashcart}
    username: ${SPRING_DATASOURCE_USERNAME:flashcart}
    password: ${SPRING_DATASOURCE_PASSWORD:flashcart_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: flashcart-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: record
      missing-topics-fatal: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

flashcart:
  jwt:
    secret: ${FLASHCART_JWT_SECRET}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
    cookie-secure: ${FLASHCART_COOKIE_SECURE:false}
  upload:
    directory: ${FLASHCART_UPLOAD_DIRECTORY:./uploads/images}
  reservation:
    ttl-minutes: ${RESERVATION_TTL_MINUTES:15}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  rate-limit:
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MIN:30}
    flash-sale-requests-per-minute: ${FLASH_SALE_RATE_LIMIT_PER_MIN:120}
    trust-proxy: ${FLASHCART_TRUST_PROXY:false}
  cache:
    enabled: ${FLASHCART_CACHE_ENABLED:true}
  kafka:
    enabled: ${KAFKA_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: flashcart-backend

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.flashcart: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [cid=%X{correlationId:-}] - %msg%n"
